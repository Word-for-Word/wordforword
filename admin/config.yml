backend:
  name: github
  repo: Word-for-Word/wordforword
  branch: main
  # The OAuth helper (see ~/Desktop/word-for-word-cms-auth, deployed as
  # the "word-for-word-cms-auth" Cloudflare Worker) that handles GitHub
  # login — GitHub Pages can't run server code itself to do this directly.
  base_url: https://word-for-word-cms-auth.word-for-word.workers.dev
  auth_endpoint: auth

# No leading slash — these are plain repo-root-relative paths, matching
# what scripts/build_articles.py expects in each article's `illustration`
# field (see that script's build_article()). A leading slash would
# resolve from the DOMAIN root, which breaks on GitHub Pages "project"
# sites (served under /wordforword/, not the bare domain) — a relative
# path works the same regardless of where the site is actually deployed.
media_folder: "assets/images/articles"
public_folder: "assets/images/articles"

collections:
  - name: "articles"
    label: "Articles"
    folder: "content/articles"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Interviews", value: "interviews" }
          - { label: "Essays", value: "essays" }
          - { label: "Narratives", value: "narratives" }
          - { label: "Outreach", value: "outreach" }
      - { label: "Date", name: "date", widget: "date", format: "YYYY-MM-DD" }
      - { label: "Author", name: "author", widget: "string" }
      - { label: "Designer", name: "designer", widget: "string" }
      - label: "Summary"
        name: "summary"
        widget: "text"
        hint: "One or two sentences — shown on the Publications listing page."
      - { label: "Illustration", name: "illustration", widget: "image" }
      - { label: "Illustration alt text", name: "illustration_alt", widget: "string", required: false, hint: "Describes the image for screen readers." }
      - { label: "Illustration caption", name: "illustration_caption", widget: "string", required: false }
      - label: "Feature in homepage carousel?"
        name: "show_in_carousel"
        widget: "boolean"
        default: false
        required: false
        hint: "Also needs a Carousel image below. The homepage carousel only ever shows the 6 most recently published articles that have this checked — if fewer than 6 articles are marked, the homepage keeps its current placeholder slides instead of showing a half-empty carousel."
      - label: "Carousel image"
        name: "carousel_image"
        widget: "image"
        required: false
        hint: "Only used if 'Feature in homepage carousel?' is checked. Wide image, ideally around 1600×800px (a 2:1 ratio) — it fills a wide frame and crops to fit, so keep the main subject centered."
      - label: "Carousel title"
        name: "carousel_title"
        widget: "string"
        required: false
        hint: "Optional shorter title for the homepage carousel. Split into 2 lines at the first colon or dash, e.g. 'The Consumptive’s Kiss: Tuberculosis & the Elegance of Death'. Leave blank to use the full title."
      - label: "Carousel position"
        name: "carousel_order"
        widget: "select"
        options: ["1", "2", "3", "4", "5", "6"]
        required: false
        hint: "Which carousel slide this is (1 = first). Articles without a position fill any leftover slots, newest first."
      - label: "Carousel shadow"
        name: "carousel_shadow"
        widget: "select"
        options: ["normal", "stronger"]
        default: "normal"
        required: false
        hint: "'Stronger' darkens the shading behind the carousel title, for images where the text is hard to read."
      - label: "Carousel text color"
        name: "carousel_caption_color"
        widget: "select"
        options: ["auto", "cream", "brown"]
        default: "auto"
        required: false
        hint: "Auto picks brown text for pale images and cream text for everything else. Only change this if auto gets it wrong for this image."
      - label: "Volume #"
        name: "volume"
        widget: "string"
        required: false
        hint: "Shown in the carousel caption, e.g. \"Volume 2\". Only used if 'Feature in homepage carousel?' is checked."
      - label: "Body"
        name: "body"
        widget: "markdown"
        # Keeps contributors inside the subset scripts/build_articles.py
        # actually knows how to render (paragraphs, bold, italic, links,
        # blockquotes, headers, bullet lists) — anything else typed in
        # raw-markdown mode would render as plain text rather than
        # breaking the build, but staying in this toolbar avoids that
        # surprise entirely. One exception with no toolbar button: wrap
        # text in ^...^ for superscript (e.g. a citation marker like
        # "...store.^1^") — has to be typed directly in raw-markdown mode.
        buttons: ["bold", "italic", "link", "quote", "bulleted-list"]
        editor_components: []
      - label: "Works Cited"
        name: "works_cited"
        widget: "list"
        required: false
        hint: "Optional — one citation per entry, plain text (no markdown). Renders in smaller type below the article body, separate from it."
