    <!-- Same header markup as index.html's own <header>, minus the
         intro-reveal/intro-reveal--drop classes and --intro-delay style —
         secondary pages (this one included) have no homepage intro splash
         to choreograph against, so the header just renders visible from
         the start. See initIntroReveal() in main.js: with no
         .intro-reveal elements on the page, it sets body.intro-finished
         immediately instead of waiting on a timer, which is what the
         Publications dropdown's own height transition is gated on.

         The BASE placeholder is substituted by the build script with the
         site root "/" for every page, article pages (articles/<slug>.html)
         included — every link/asset path below goes through it so this ONE
         partial works unchanged regardless of which folder depth the page
         calling it actually lives at. -->
    <header class="site-header">
      <div class="nav__dropdown-hover-zone" aria-hidden="true"></div>
      <div class="site-header__clip">
        <a href="{{BASE}}" class="nav__logo">
          <img src="{{BASE}}assets/images/Logo.png" alt="Word for Word logo" />
        </a>
        <nav class="nav">
          <ul class="nav__links">
            <li><a href="{{BASE}}">Overview</a></li>
            <li class="nav__item--publications">
              <!-- TEMPORARY: dropdown + asterisk hidden — Interviews/Essays/
                   Narratives/Outreach are all still empty and shouldn't be
                   navigable right now. Remove the two style="display:none;"
                   below once those pages have real content. -->
              <a href="{{BASE}}publications/">Publications<span class="nav__link-asterisk" style="display:none;">*</span></a>
              <div class="nav__dropdown" style="display:none;">
                <a href="{{BASE}}#publications"><span class="nav__dropdown-asterisk">*</span><span class="nav__dropdown-text">Volumes</span></a>
                <a href="{{BASE}}interviews/"><span class="nav__dropdown-asterisk">*</span><span class="nav__dropdown-text">Interviews</span></a>
                <a href="{{BASE}}essays/"><span class="nav__dropdown-asterisk">*</span><span class="nav__dropdown-text">Essays</span></a>
                <a href="{{BASE}}narratives/"><span class="nav__dropdown-asterisk">*</span><span class="nav__dropdown-text">Narratives</span></a>
                <a href="{{BASE}}outreach/"><span class="nav__dropdown-asterisk">*</span><span class="nav__dropdown-text">Outreach</span></a>
              </div>
            </li>
            <li><a href="{{BASE}}about/">About Us</a></li>
            <!-- TEMPORARY: points at the interest form instead of the real
                 /get-involved/ page — placeholder for a specific presentation
                 (club president can't have the page sit blank), not a
                 permanent change. Revert to <a href="{{BASE}}get-involved/">
                 once the real page has content again. -->
            <li><a href="https://docs.google.com/forms/d/e/1FAIpQLSekNHyxHjFhO780Tgh72kdI6hmglggJ9eWfJ20KYRUA1DUtww/viewform" target="_blank" rel="noopener">Get Involved</a></li>
            <li class="nav__indicator-slot" aria-hidden="true"><span class="nav__indicator"></span></li>
          </ul>
        </nav>
      </div>
    </header>
    <div class="nav-dim-overlay" aria-hidden="true"></div>
