    <!-- Same header markup as index.html's own <header>, minus the
         intro-reveal/intro-reveal--drop classes and --intro-delay style —
         secondary pages (this one included) have no homepage intro splash
         to choreograph against, so the header just renders visible from
         the start. See initIntroReveal() in main.js: with no
         .intro-reveal elements on the page, it sets body.intro-finished
         immediately instead of waiting on a timer, which is what the
         Publications dropdown's own height transition is gated on.

         The BASE placeholder is substituted by the build script with the
         site root "/" for every page, article pages (articles/<slug>.html)
         included — every link/asset path below goes through it so this ONE
         partial works unchanged regardless of which folder depth the page
         calling it actually lives at. -->
    <header class="site-header">
      <div class="nav__dropdown-hover-zone" aria-hidden="true"></div>
      <div class="site-header__clip">
        <a href="{{BASE}}" class="nav__logo">
          <img src="{{BASE}}assets/images/Logo.png" alt="Word for Word logo" />
        </a>
        <!-- Mobile-only (see .nav__hamburger in style.css) — replaces
             .nav/.nav__dropdown below entirely under max-width:720px,
             opening .nav__mobile-dropdown (a sibling of this whole
             <header>, below) instead. See that class's own comment for
             why it's a separate system from the Publications dropdown
             rather than a reuse of it. -->
        <button type="button" class="nav__hamburger" aria-label="Menu" aria-expanded="false" aria-controls="nav__mobile-dropdown">
          <span class="nav__hamburger-line"></span>
          <span class="nav__hamburger-line"></span>
          <span class="nav__hamburger-line"></span>
        </button>
        <nav class="nav">
          <ul class="nav__links">
            <li><a href="{{BASE}}">Overview</a></li>
            <li class="nav__item--publications">
              <a href="{{BASE}}publications/">Publications<span class="nav__link-asterisk">*</span></a>
            </li>
            <li><a href="{{BASE}}about/">About Us</a></li>
            <li><a href="{{BASE}}get-involved/">Get Involved</a></li>
            <li class="nav__indicator-slot" aria-hidden="true"><span class="nav__indicator"></span></li>
          </ul>
        </nav>
        <!-- See index.html's own comment above <header> for why this lives
             here now instead of nested inside .nav__item--publications. -->
        <div class="nav__dropdown">
          <a href="{{BASE}}volumes/">
            <span class="nav__dropdown-number">(01)</span>
            <span class="nav__dropdown-asterisk">*</span><span class="nav__dropdown-text">Volumes</span>
          </a>
          <a href="{{BASE}}interviews/">
            <span class="nav__dropdown-number">(02)</span>
            <span class="nav__dropdown-asterisk">*</span><span class="nav__dropdown-text">Interviews</span>
          </a>
          <a href="{{BASE}}essays/">
            <span class="nav__dropdown-number">(03)</span>
            <span class="nav__dropdown-asterisk">*</span><span class="nav__dropdown-text">Essays</span>
          </a>
          <a href="{{BASE}}narratives/">
            <span class="nav__dropdown-number">(04)</span>
            <span class="nav__dropdown-asterisk">*</span><span class="nav__dropdown-text">Narratives</span>
          </a>
          <a href="{{BASE}}outreach/">
            <span class="nav__dropdown-number">(05)</span>
            <span class="nav__dropdown-asterisk">*</span><span class="nav__dropdown-text">Outreach</span>
          </a>
          <div class="nav__dropdown-visual" aria-hidden="true">
            <img class="nav__dropdown-visual-img" src="{{BASE}}assets/images/Dropdown Visual.png" alt="" />
            <div class="nav__dropdown-visual-asterisk-wrap">
              <img class="nav__dropdown-visual-asterisk" src="{{BASE}}assets/images/Asterisk - Default, Cream.png" alt="" />
            </div>
          </div>
        </div>
      </div>
    </header>
    <!-- Mobile hamburger's own dropdown — see .nav__hamburger's own
         comment above and .nav__mobile-dropdown in style.css. Reuses
         the SAME row/visual classes as .nav__dropdown above (numbers/
         asterisks/text/illustration) for visual parity, just the 4
         top-level nav items instead of Publications' own 5 categories,
         and its own simpler tap-toggle mechanics (initMobileNavDropdown()
         in main.js) rather than that one's hover/grace-period system. -->
    <div id="nav__mobile-dropdown" class="nav__mobile-dropdown" aria-hidden="true">
      <div class="nav__mobile-dropdown-inner">
        <a href="{{BASE}}">
          <span class="nav__dropdown-number">(01)</span>
          <span class="nav__dropdown-asterisk">*</span><span class="nav__dropdown-text">Overview</span>
        </a>
        <a href="{{BASE}}publications/">
          <span class="nav__dropdown-number">(02)</span>
          <span class="nav__dropdown-asterisk">*</span><span class="nav__dropdown-text">Publications</span>
        </a>
        <a href="{{BASE}}about/">
          <span class="nav__dropdown-number">(03)</span>
          <span class="nav__dropdown-asterisk">*</span><span class="nav__dropdown-text">About Us</span>
        </a>
        <a href="{{BASE}}get-involved/">
          <span class="nav__dropdown-number">(04)</span>
          <span class="nav__dropdown-asterisk">*</span><span class="nav__dropdown-text">Get Involved</span>
        </a>
        <div class="nav__dropdown-visual" aria-hidden="true">
          <img class="nav__dropdown-visual-img" src="{{BASE}}assets/images/Dropdown Visual.png" alt="" />
          <div class="nav__dropdown-visual-asterisk-wrap">
            <img class="nav__dropdown-visual-asterisk" src="{{BASE}}assets/images/Asterisk - Default, Cream.png" alt="" />
          </div>
        </div>
      </div>
    </div>
    <div class="nav-dim-overlay" aria-hidden="true"></div>
