<body>
  <!-- Must run before the rest of <body> parses, same reasoning as
       index.html's own equivalent script — sets html.show-page-flash
       synchronously so the flash is visible from first paint instead of
       popping in a frame late. One-shot: cleared the instant it's read,
       so only a nav-link arrival (see initNavPageFlash() in main.js)
       shows it — a fresh reload/direct visit never sets this flag. Same
       screen 02 every other family page under Publications uses. -->
  <script>
    if (sessionStorage.getItem("wfw-page-flash") === "02") {
      sessionStorage.removeItem("wfw-page-flash");
      document.documentElement.classList.add("show-page-flash");
    }
  </script>
  <div class="page-flash" aria-hidden="true">
    <div class="page-flash__color page-flash--02">
      <img class="page-flash__asterisk" src="{{BASE}}assets/images/Asterisk 2 (nav).png" alt="" />
      <p class="page-flash__caption page-flash__caption--02">
        <span class="intro-splash__caption-line1">volumes.</span>
        <span class="intro-splash__caption-line2">(02)</span>
      </p>
    </div>
  </div>
{{HEADER}}

  <main class="publications-main">
    <!-- Structured like interviews/essays/narratives/outreach — a small
         .section-eyebrow, not an elaborate hero. publications-category
         (style.css) is what gives this the same top clearance under the
         fixed header those 4 pages get; reused directly rather than a
         new class, since this page's own layout need is identical. -->
    <section id="publications" class="publications-category">
      <div class="section-eyebrow">
        <span>Volumes</span>
        <span class="section-eyebrow__rule" aria-hidden="true"></span>
      </div>
      <!-- Same grid as /publications/'s own #publications section (and
           index.html's preview of it) — publication-card--clickable +
           data-pdf opens the edition lightbox (initEditionLightbox() in
           main.js); only wired up for editions with a finished PDF, the
           other 2 cards stay plain, non-interactive covers until theirs
           are ready. -->
      <div class="publications__grid">
        <article class="publication-card publication-card--clickable" data-pdf="{{BASE}}assets/pdfs/wfw-vol1-summer-sampler.pdf" data-pdf-title="Volume 1 — Summer Sampler" role="button" tabindex="0">
          <div class="publication-card__cover">
            <img class="publication-card__cover-image" src="{{BASE}}assets/images/Cover_ Volume 1.jpg" alt="Word for Word Volume 1 cover" />
          </div>
          <p class="publication-card__meta">Summer 2024 — Vol. 1</p>
        </article>
        <article class="publication-card publication-card--clickable" data-pdf="{{BASE}}assets/pdfs/wfw-vol2-fall26.pdf" data-pdf-title="Volume 2 — Fall 2026" role="button" tabindex="0">
          <div class="publication-card__cover">
            <img class="publication-card__cover-image" src="{{BASE}}assets/images/Cover_ Volume 2.jpg" alt="Word for Word Volume 2 cover" />
          </div>
          <p class="publication-card__meta">Fall 2026 — Vol. 2</p>
        </article>
        <article class="publication-card">
          <div class="publication-card__cover">
            <img class="publication-card__cover-image" src="{{BASE}}assets/images/Cover_ Upcoming Volume.webp" alt="" />
            <p class="publication-card__cover-caption">Coming soon!</p>
          </div>
          <p class="publication-card__meta">Fall 2025 — Vol. 3</p>
        </article>
      </div>
    </section>

    <!-- ============ QUOTE / SLOGAN ============ -->
    <!-- Same .quote-block as index.html's own — see that file's own
         comment above it for the class/mosaic-reveal reasoning
         (fade-in-on-scroll, tile-by-tile mask assembly). Visible here
         (unlike the same section on /publications/, still display:none
         pending real Spotlight content) — per explicit request, this
         page's own content is just the 3 volumes above and this slogan,
         nothing hidden/placeholder. -->
    <section class="quote-block">
      <div class="quote-block__image">
        <img class="quote-block__photo" src="{{BASE}}assets/images/Slogan.jpg" alt="Empowering voices previously unheard." />
      </div>
      <div class="quote-block__overlay mosaic-reveal">
        <p class="quote-block__overlay-text"><em>Empowering</em> voices<br />previously <em>unheard</em></p>
      </div>
    </section>
  </main>

{{FOOTER}}
</body>
</html>
