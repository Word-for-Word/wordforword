<body>
  <!-- Must run before the rest of <body> parses, same reasoning as
       index.html's own equivalent script — sets html.show-page-flash
       synchronously so the flash is visible from first paint instead of
       popping in a frame late. One-shot: cleared the instant it's read,
       so only a nav-link arrival (see initNavPageFlash() in main.js)
       shows it — a fresh reload/direct visit never sets this flag. Every
       category page shares screen 02 (grouped under Publications, the
       nav item they all live under) — only the caption word itself
       varies per category. -->
  <script>
    if (sessionStorage.getItem("wfw-page-flash") === "02") {
      sessionStorage.removeItem("wfw-page-flash");
      document.documentElement.classList.add("show-page-flash");
    }
  </script>
  <div class="page-flash" aria-hidden="true">
    <div class="page-flash__color page-flash--02">
      <img class="page-flash__asterisk" src="{{BASE}}assets/images/Asterisk 2 (nav).png" alt="" />
      <p class="page-flash__caption page-flash__caption--02">
        <span class="intro-splash__caption-line1">{{LABEL_LOWER}}.</span>
        <span class="intro-splash__caption-line2">(02)</span>
      </p>
    </div>
  </div>

       .quote-block__overlay text entirely) — see that file's own comment

       verbatim (fade-in-on-scroll, tile-by-tile mask assembly, comes
       free from the existing selector list/initQuoteBlockTiles() in
       main.js). Now sits INSIDE <main> (was after </main>) — matches
       index.html's own nesting exactly (both quote-block and partners
       sit inside <main>, only the footer partial is outside), so this
       page picks up the SAME main { gap: 60px } spacing between them
       that index.html gets. -->
  <section class="quote-block">

      <img class="quote-block__photo" src="{{BASE}}assets/images/Slogan.jpg" alt="Empowering voices previously unheard." />

      <p class="quote-block__overlay-text"><em>Empowering</em> voices<br />previously <em>unheard</em></p>
    </div>
  </section>
