  <!-- Must run before the rest of <body> parses, same reasoning as
       index.html's own equivalent script — sets html.show-page-flash
       synchronously so the flash is visible from first paint instead of
       popping in a frame late. One-shot: cleared the instant it's read,
       so only a nav-link arrival (see initNavPageFlash() in main.js)
       shows it — a fresh reload/direct visit never sets this flag. -->
  <script>
    if (sessionStorage.getItem("wfw-page-flash") === "03") {
      sessionStorage.removeItem("wfw-page-flash");
      document.documentElement.classList.add("show-page-flash");
    }
  </script>
  <div class="page-flash" aria-hidden="true">

        <span class="intro-splash__caption-line1">about us.</span>

      </p>
    </div>
  </div>
    <!-- Same header markup as index.html's own <header>, minus the

         .intro-reveal elements on the page, it sets body.intro-finished
         immediately instead of waiting on a timer, which is what the
         Publications dropdown's own height transition is gated on. -->

       same --intro-delay values, same asset references) so the
